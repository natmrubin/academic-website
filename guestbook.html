<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guestbook – Nat Rubin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #f3f2f2; font-family: 'Lora', serif; color: #201f1d; line-height: 1.6; }
  a { color: #7d5411; text-decoration: none; }
  a:hover { color: #b68235; text-decoration: underline; }
  ::selection { background: rgba(182,130,53,0.3); }

  nav {
    display: flex; align-items: center; gap: 27.6px;
    padding: 13.8px 36.8px;
    border-bottom: 1px solid rgba(32,31,29,0.16);
  }
  nav .site-name {
    font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 18px; margin-right: auto;
    color: #201f1d;
  }
  nav a { font-size: 14px; color: #201f1d; }

  main {
    max-width: 640px; margin: 0 auto; padding: 64px 36.8px 80px;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 36px;
    margin: 0 0 10px; line-height: 1.1;
  }
  .subtitle {
    font-size: 15px; color: rgba(32,31,29,0.6); margin-bottom: 36px;
  }
  .divider { height: 1px; background: rgba(32,31,29,0.16); margin-bottom: 36px; }

  form { display: flex; flex-direction: column; gap: 18px; }

  label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: rgba(32,31,29,0.55); display: block; margin-bottom: 6px; }

  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    font-family: 'Lora', serif;
    font-size: 15px;
    color: #201f1d;
    background: #fff;
    border: 1px solid rgba(32,31,29,0.22);
    border-radius: 4px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s;
    resize: vertical;
  }
  input[type="text"]:focus,
  input[type="email"]:focus,
  textarea:focus {
    border-color: #b68235;
  }
  textarea { min-height: 130px; }

  button[type="submit"] {
    align-self: flex-start;
    font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 15px;
    padding: 10px 22px;
    border: 1px solid #b68235; border-radius: 4px;
    background: transparent; color: #b68235;
    cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  button[type="submit"]:hover { background: #b68235; color: #fff; }

  .success {
    display: none;
    background: #fff;
    border: 1px solid rgba(32,31,29,0.16);
    border-radius: 6px;
    padding: 28px 32px;
    font-size: 15px;
  }
  .success strong {
    font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600;
    display: block; margin-bottom: 8px;
  }

  footer {
    max-width: 900px; margin: 0 auto;
    padding: 27.6px 36.8px 55px;
    font-size: 13px; color: rgba(32,31,29,0.55);
    text-align: center; border-top: 1px solid rgba(32,31,29,0.16);
  }
</style>
</head>
<body>

<nav>
  <a href="Home.dc.html" class="site-name">Nat Rubin</a>
  <a href="Home.dc.html">Home</a>
  <a href="Working Papers.dc.html">Working Papers</a>
  <a href="CV.dc.html">CV</a>
  <a href="Contact.dc.html">Contact</a>
</nav>

<main>
  <h1>Guestbook</h1>
<div class="divider"></div>

  <div class="success" id="success">
    <strong>Message sent.</strong>
    Thanks for signing the guestbook. I'll read every note.
  </div>

  <form action="https://formsubmit.co/nmr2162@columbia.edu" method="POST">
    <input type="hidden" name="_subject" value="New guestbook message – natrubin.com">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://natrubin.com/guestbook.html?sent=1">

    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>
    </div>
    <div>
      <label for="email">Email <span style="font-size:11px;text-transform:none;letter-spacing:0;">(optional)</span></label>
      <input type="email" id="email" name="email" placeholder="your@email.com">
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write something…" required></textarea>
    </div>

    <button type="submit">Leave a message</button>
  </form>
</main>

<footer>© 2026 Nat Rubin</footer>

<script>
  if (new URLSearchParams(location.search).get('sent') === '1') {
    document.querySelector('form').style.display = 'none';
    document.getElementById('success').style.display = 'block';
  }
</script>
</body>
</html>
