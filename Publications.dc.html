<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lora:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    body { margin: 0; background: #f3f2f2; }
    a { color: #7d5411; text-decoration: none; }
    a:hover { color: #b68235; text-decoration: underline; }
    ::selection { background: rgba(182,130,53,0.3); }
  </style>
</helmet>

<div style="font-family: 'Lora', serif; color: #201f1d; line-height: 1.6;">

  <nav style="display: flex; align-items: center; gap: 27.6px; padding: 13.8px 36.8px; border-bottom: 1px solid rgba(32,31,29,0.16);">
    <div style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 18px; margin-right: auto;">Nat Rubin</div>
    <a href="Home.dc.html" style="font-size: 14px; color: #201f1d;">Home</a>
    <a href="Working Papers.dc.html" style="font-size: 14px; color: #201f1d;">Working Papers</a>
    <a href="Publications.dc.html" style="font-size: 14px; color: #b68235;">Publications</a>
    <a href="CV.dc.html" style="font-size: 14px; color: #201f1d;">CV</a>
    <a href="Contact.dc.html" style="font-size: 14px; color: #201f1d;">Contact</a>
  </nav>

  <section style="max-width: 780px; margin: 0 auto; padding: 55px 36.8px 92px;">
    <h1 style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 34px; margin: 0 0 36.8px;">Publications</h1>

    <sc-for list="{{ pubs }}" as="pub" hint-placeholder-count="2">
      <div style="padding: 22px 0; border-bottom: 1px solid rgba(32,31,29,0.16);">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 20px; margin: 0 0 6px; line-height: 1.25;">{{ pub.title }}</h2>
        <div style="font-size: 14px; color: rgba(32,31,29,0.6); margin-bottom: 10px;">{{ pub.venue }}</div>
        <a href="{{ pub.link }}" style="font-size: 14px;">View article</a>
      </div>
    </sc-for>
  </section>

  <footer style="max-width: 900px; margin: 0 auto; padding: 27.6px 36.8px 55px; font-size: 13px; color: rgba(32,31,29,0.55); text-align: center; border-top: 1px solid rgba(32,31,29,0.16);">© 2026 Nat Rubin · <a href="mailto:nrubin@columbia.edu">nrubin@columbia.edu</a></footer>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      pubs: [
        {
          title: "Coalitions of Convenience: Cross-Party Alliances in Fragmented Parliaments",
          venue: "Journal of Comparative Politics, 2025",
          link: "#"
        },
        {
          title: "Measuring Democratic Backsliding: A Cross-National Index",
          venue: "with M. Okafor — Political Analysis, 2024",
          link: "#"
        }
      ]
    };
  }
}

</script>
</body>
</html>
