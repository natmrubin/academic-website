<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lora:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    body { margin: 0; background: #f3f2f2; }
    a { color: #7d5411; text-decoration: none; }
    a:hover { color: #b68235; text-decoration: underline; }
    ::selection { background: rgba(182,130,53,0.3); }
  </style>
</helmet>

<div style="font-family: 'Lora', serif; color: #201f1d; line-height: 1.6;">

  <nav style="display: flex; align-items: center; gap: 27.6px; padding: 13.8px 36.8px; border-bottom: 1px solid rgba(32,31,29,0.16);">
    <div style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 18px; margin-right: auto;">Nat Rubin</div>
    <a href="Home.dc.html" style="font-size: 14px; color: #201f1d;">Home</a>
    <a href="Working Papers.dc.html" style="font-size: 14px; color: #b68235;">Working Papers</a>
    <a href="CV.dc.html" style="font-size: 14px; color: #201f1d;">CV</a>
    <a href="Contact.dc.html" style="font-size: 14px; color: #201f1d;">Contact</a>
  </nav>

  <section style="max-width: 780px; margin: 0 auto; padding: 55px 36.8px 92px;">
    <h1 style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 34px; margin: 0 0 9.2px;">Working Papers</h1>

    <sc-for list="{{ papers }}" as="paper" hint-placeholder-count="3">
      <div style="padding: 27.6px 0; border-bottom: 1px solid rgba(32,31,29,0.16);">
        <div style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #7d5411; margin-bottom: 6px;">{{ paper.status }}</div>
        <h2 style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 22px; margin: 0 0 6px; line-height: 1.25;">{{ paper.title }}</h2>
        <div style="font-size: 14px; color: rgba(32,31,29,0.6); margin-bottom: 13.8px;">{{ paper.coauthors }}</div>
        <p style="font-size: 15px; text-align: justify; margin: 0 0 13.8px;">{{ paper.abstract }}</p>
        <div style="display: flex; gap: 18.4px; font-size: 14px;">
          <a href="{{ paper.pdfLink }}">Download PDF</a>
          <a href="{{ paper.slidesLink }}">Slides</a>
        </div>
      </div>
    </sc-for>
  </section>

  <footer style="max-width: 900px; margin: 0 auto; padding: 27.6px 36.8px 55px; font-size: 13px; color: rgba(32,31,29,0.55); text-align: center; border-top: 1px solid rgba(32,31,29,0.16);">© 2026 Nat Rubin</footer>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      papers: [
        {
          status: "Job Market Paper",
          title: "Why Enforce? Policing Under Non-Prosecution Policies",
          coauthors: "Solo-authored",
          abstract: "To what extent does criminal punishment incentivize police officers to make low-level arrests? This paper examines whether non-prosecution (categorical declination) policies alter discretionary misdemeanor policing by changing the incentives facing patrol officers. Using a staggered adoption design with synthetic controls, I find officers continue to make arrests despite a total lack of prosecution. This suggests that misdemeanor arrests provide utility to police officers outside of the deterrent effect of punishment.",
          pdfLink: "#", slidesLink: "#"
        },
        {
          status: "Draft — comments welcome",
          title: "Do Retention Elections Create Cycles in Criminal Sentencing? An Out-of-Sample Replication",
          coauthors: "with Donald P. Green",
          abstract: "Judicial retention elections are notoriously low-salience, uncompetitive events where incumbents virtually never lose. However, some articles have found that criminal court judges become significantly more punitive as these safe elections approach. Using newly available data spanning several election cycles, we conduct an out-of-sample replication of the most widely cited article in this literature (Huber and Gordon 2004) and find no evidence of election cycle effects.",
          pdfLink: "#", slidesLink: "#"
        }
      ]
    };
  }
}

</script>
</body>
</html>
